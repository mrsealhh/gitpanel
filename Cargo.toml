[workspace]
members = ["crates/git-core", "crates/perf-probe", "crates/gitpanel-mcp", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.4.4"
edition = "2021"

[workspace.dependencies]
git2 = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[profile.release]
# 不开 LTO：rustc 1.100 在 linker-plugin-lto 下编译 plist 会 ACCESS_VIOLATION，
# 且 GUI 应用对 LTO 收益不敏感，`strip` 后体积已经很可观。
lto = false
codegen-units = 1
opt-level = 3
strip = true
