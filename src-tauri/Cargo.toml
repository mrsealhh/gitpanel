[package]
name = "gitpanel"
version = "0.1.0"
edition = "2021"
description = "本地 Git 可视化管理面板"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
git-core = { path = "../crates/git-core" }
