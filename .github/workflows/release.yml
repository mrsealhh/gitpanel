name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  # 先建好 Release，再让三个平台并行上传各自的安装包，避免并发创建冲突
  create-release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v4
      - name: Create release
        id: create
        uses: actions/github-script@v7
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            try {
              const { data } = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              })
              return data.id
            } catch (e) {
              const { data } = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `GitPanel ${tag}`,
                body: [
                  '本地 Git 可视化管理面板。',
                  '',
                  '- Windows：`GitPanel_*_x64-setup.exe`（NSIS，支持自动更新）',
                  '- macOS：`GitPanel_*_*.dmg`',
                  '- Linux：`.deb` / `.AppImage`',
                  '',
                  '所有版本纯本地运行，不上传任何代码或凭据。',
                ].join('\n'),
                draft: false,
                prerelease: false,
              })
              return data.id
            }

  build:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: '--config src-tauri/tauri.release.conf.json'
          - platform: macos-latest
            args: '--config src-tauri/tauri.release.conf.json'
          - platform: ubuntu-22.04
            args: '--config src-tauri/tauri.release.conf.json'
    runs-on: ${{ matrix.platform }}
    env:
      # 与 tauri-action 期望的产物目录一致（src-tauri/target）；
      # 仓库里的 .cargo/config.toml 不再写死平台相关目录，这里显式指定
      CARGO_TARGET_DIR: ${{ github.workspace }}/src-tauri/target
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> src-tauri/target'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}
