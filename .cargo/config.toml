# 编译产物目录由 scripts/with-cargo-target.mjs 按平台决定：
# - Windows 本机开发重定向到 C 盘 SSD，绕开机械盘的随机小文件读写瓶颈
# - macOS / Linux 保持 Cargo 默认的 target/，避免把 C:/... 当成相对路径
# 这里不写死 target-dir，直接 cargo 命令在任何平台都能正常编译。

# 国内网络下用系统 git 拉取依赖，比内置 libgit2 更稳（支持代理与凭据）
[net]
git-fetch-with-cli = true

# crates.io 镜像（rsproxy）。若在公司网络不可用，删掉下面 5 行即可回退官方源。
[source.crates-io]
replace-with = "rsproxy-sparse"

[source.rsproxy-sparse]
registry = "sparse+https://rsproxy.cn/index/"

[alias]
ck = "check"
